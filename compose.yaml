name: investhelper

services:
  backend:
    build:
      context: ./backend
    image: investhelper-backend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      TINKOFF_TOKEN: ${TINKOFF_TOKEN:-your_token_here}
      TINKOFF_MODE: ${TINKOFF_MODE:-prod}
      TINKOFF_SSL_VERIFY: ${TINKOFF_SSL_VERIFY:-true}
      TINKOFF_SSL_CA_FILE: ${TINKOFF_SSL_CA_FILE:-}
      TINKOFF_HTTPS_PROXY: ${TINKOFF_HTTPS_PROXY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-8192}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    image: investhelper-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
